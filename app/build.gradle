plugins {
    id 'com.android.application'
}

android {
    namespace 'com.doulala.android'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.doulala.android'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '0.3.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    testBuildType 'deviceValidation'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        deviceValidation {
            initWith debug
            applicationIdSuffix '.validation'
            versionNameSuffix '-validation'
            matchingFallbacks = ['debug']
        }
        // Separate package for CK session checks: never requires deleting user data
        // from the previously installed runner-signed debug/validation packages.
        sessionValidation {
            initWith debug
            applicationIdSuffix '.ckcheck'
            versionNameSuffix '-ckcheck'
            matchingFallbacks = ['debug']
        }
        // Side-by-side new-attachment validation; do not replace any account-bearing app.
        newSourceValidation {
            initWith debug
            applicationIdSuffix '.spaces64'
            versionNameSuffix '-spaces64'
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
        }
    }

    packaging { jniLibs { useLegacyPackaging = true } }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
