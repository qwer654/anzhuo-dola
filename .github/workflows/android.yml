name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - 'tools/verify_apk_assets.py'
      - '.gitattributes'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - 'tools/verify_apk_assets.py'
      - '.gitattributes'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Test media, Dola30 and fingerprint modules
        run: node --test tests/media-probe.test.cjs tests/dola30-source.test.cjs tests/dola30-android-adapter.test.cjs tests/fingerprint-privacy.test.cjs
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ] || [ ! -f "$SDK_ROOT/build-tools/35.0.0/apksigner" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
            test -n "$SDKMANAGER"
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -f "$SDK_ROOT/build-tools/35.0.0/apksigner"
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleDeviceValidation assembleDeviceValidationAndroidTest
      - name: Verify APK signature and record SHA-256
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/deviceValidation/app-deviceValidation.apk
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cd ../deviceValidation
          sha256sum app-deviceValidation.apk > app-deviceValidation.apk.sha256
      - name: Verify original extension bytes inside APK
        run: |
          python3 tools/verify_apk_assets.py app/build/outputs/apk/debug/app-debug.apk
          python3 tools/verify_apk_assets.py app/build/outputs/apk/deviceValidation/app-deviceValidation.apk
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doulala-android-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/deviceValidation/app-deviceValidation.apk
            app/build/outputs/apk/deviceValidation/app-deviceValidation.apk.sha256
            app/build/outputs/apk/androidTest/deviceValidation/app-deviceValidation-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
